name: Format

on:
  pull_request:
    # Draft PRs run nothing (see the job's `if`) until marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # No run on merge: the PR's runs already checked its merge with the base
  # branch. Manual runs from the Actions tab.
  workflow_dispatch:

# A new push to a PR cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned to the Prettier in yarn.lock (3.9.10) and run without installing
      # the app's dependencies, which the check doesn't need. Bump both
      # together. Same files as `yarn format:check`.
      - run: >-
          npx --yes prettier@3.9.10 --check
          "src/**/*.{ts,tsx,js}" "*.{js,ts,tsx}" ".*.js"
          "__tests__/**/*.{js,ts,tsx}" "scripts/**/*.{js,ts}"
