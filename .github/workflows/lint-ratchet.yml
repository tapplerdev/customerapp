name: Lint ratchet

on:
  pull_request:
    # Draft PRs run nothing (see the job's `if`) until marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # No run on merge: the PR's runs already checked its merge with the base
  # branch. Manual runs from the Actions tab.
  workflow_dispatch:

# A new push to a PR cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-ratchet:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      # --ignore-scripts skips patch-package, whose patches are native code
      # ESLint never reads. @tappler/shared is a link: to a sibling checkout CI
      # doesn't have; the dangling link is fine, since none of the ratcheted
      # rules resolve imports.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node scripts/lint-ratchet.js
